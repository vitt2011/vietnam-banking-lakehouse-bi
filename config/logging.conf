[loggers]
keys=root,etl,mdm,quality,warehouse

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=standardFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_etl]
level=INFO
handlers=consoleHandler,fileHandler
qualname=etl
propagate=0

[logger_mdm]
level=INFO
handlers=consoleHandler,fileHandler
qualname=mdm
propagate=0

[logger_quality]
level=INFO
handlers=consoleHandler,fileHandler
qualname=quality
propagate=0

[logger_warehouse]
level=INFO
handlers=consoleHandler,fileHandler
qualname=warehouse
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=standardFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=standardFormatter
args=('logs/platform_execution.log', 'a', 10485760, 5, 'utf-8')

[formatter_standardFormatter]
format=%(asctime)s [%(levelname)s] [%(name)s]: %(message)s
datefmt=%Y-%m-%d %H:%M:%S
