[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analysis"
version = "2.0.0"
description = "Vietnam Commercial Banking Lakehouse & Equity Research Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Stock Analysis Team" }
]
keywords = ["lakehouse", "banking", "finance", "equity-research", "camels", "gordon-growth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=15.0.0",
    "numpy>=2.0.0,<2.3.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.0",
    "requests>=2.31.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "networkx>=3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_analysis = ["py.typed"]
